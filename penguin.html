<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#09090D" />
  <title>Batriqi</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 27 16 16 29 5 16Z' fill='%23481B2B' stroke='%23C6A66B' stroke-width='2'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --ink: #09090d;
      --coal: #15151d;
      --wine: #481b2b;
      --gold: #c6a66b;
      --ash: #a6a8b0;
      --bone: #eae7e1;
      --serif-display: "Cinzel", Georgia, "Times New Roman", serif;
      --serif-body: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: radial-gradient(ellipse at 50% 30%, #14141f 0%, var(--ink) 62%);
      color: var(--bone);
      font-family: var(--serif-body);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #stars {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(4, 4, 8, 0.75) 100%);
    }

    .stage {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 2.5vh, 26px);
      padding: clamp(20px, 5vh, 56px) 20px;
      text-align: center;
    }

    .kicker {
      font-family: var(--serif-display);
      font-size: clamp(0.62rem, 1.6vw, 0.78rem);
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0.85;
      text-shadow: 0 1px 14px rgba(0, 0, 0, 0.9);
    }

    h1 {
      font-family: var(--serif-display);
      font-weight: 700;
      font-size: clamp(1.9rem, 6.5vw, 3.6rem);
      letter-spacing: 0.1em;
      color: var(--bone);
      text-shadow: 0 2px 30px rgba(0, 0, 0, 0.85), 0 0 44px rgba(198, 166, 107, 0.4);
    }

    .scene {
      width: min(92vw, 560px);
      filter: drop-shadow(0 18px 40px rgba(0, 0, 0, 0.55));
    }
    .scene svg { display: block; width: 100%; height: auto; }

    .sub {
      font-style: italic;
      font-size: clamp(1rem, 2.4vw, 1.2rem);
      color: #dcd8cf;
      text-shadow: 0 1px 18px rgba(0, 0, 0, 0.9);
      max-width: 42ch;
    }

    .navrow {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 6px;
    }
    .back {
      display: inline-block;
      font-family: var(--serif-display);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--gold);
      text-decoration: none;
      background: rgba(9, 9, 14, 0.55);
      border: 1px solid rgba(198, 166, 107, 0.6);
      padding: 16px 38px;
      transition: background 0.3s ease, box-shadow 0.3s ease, color 0.3s ease;
    }
    .back:hover,
    .back:focus-visible {
      background: rgba(198, 166, 107, 0.18);
      box-shadow: 0 0 30px rgba(198, 166, 107, 0.28);
      color: #e6cf9e;
    }
    .back.subtle {
      color: rgba(166, 168, 176, 0.85);
      border-color: rgba(198, 166, 107, 0.3);
      font-size: 0.7rem;
      padding: 14px 28px;
    }
    .back.subtle:hover { color: var(--gold); border-color: var(--gold); }

    /* Gentle life */
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    @keyframes sparkle {
      0%, 100% { opacity: 0.15; transform: scale(0.7); }
      50% { opacity: 0.9; transform: scale(1.1); }
    }
    @keyframes wave {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-8deg); }
    }
    #penguin { animation: bob 4.5s ease-in-out infinite; }
    #flipperWave { transform-origin: 272px 238px; animation: wave 2.8s ease-in-out infinite; }
    .spark { transform-origin: center; transform-box: fill-box; animation: sparkle 3.4s ease-in-out infinite; }
    .spark:nth-of-type(2) { animation-delay: 1.1s; }
    .spark:nth-of-type(3) { animation-delay: 2.2s; }

    @media (prefers-reduced-motion: reduce) {
      #penguin, #flipperWave, .spark { animation: none; }
    }
  </style>
</head>

  <script>
    // Twinkling starfield — same vibes as the main sky, featherweight edition.
    (function () {
      const canvas = document.getElementById('stars');
      const ctx = canvas.getContext('2d');
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let stars = [];
      let w = 0, h = 0, dpr = 1;

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const count = Math.min(180, Math.round((w * h) / 9000));
        stars = Array.from({ length: count }, () => ({
          x: Math.random() * w,
          y: Math.random() * h,
          r: 0.4 + Math.random() * 1.1,
          p: Math.random() * Math.PI * 2,
          s: 0.4 + Math.random() * 0.8,
          warm: Math.random() < 0.3,
        }));
      }

      function draw(t) {
        ctx.clearRect(0, 0, w, h);
        for (const st of stars) {
          const tw = reduced ? 0.8 : 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(st.p + t * 0.001 * st.s));
          ctx.globalAlpha = tw;
          ctx.fillStyle = st.warm ? '#e8d3a8' : '#dfe2ea';
          ctx.beginPath();
          ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      window.addEventListener('resize', () => { resize(); draw(0); });
      resize();
      if (reduced) {
        draw(0);
      } else {
        (function loop(t) { draw(t); requestAnimationFrame(loop); })(0);
      }
    })();
  </script>
</body>

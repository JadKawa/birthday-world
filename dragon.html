<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#09090D" />
  <title>Lamar's Dragon</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 27 16 16 29 5 16Z' fill='%23481B2B' stroke='%23C6A66B' stroke-width='2'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --ink: #09090d;
      --gold: #c6a66b;
      --ash: #a6a8b0;
      --bone: #eae7e1;
      --serif-display: "Cinzel", Georgia, "Times New Roman", serif;
      --serif-body: "Cormorant Garamond", Georgia, "Times New Roman", serif;
      --body: #3f8f5f;
      --dark: #2c6b45;
      --belly: #f2e6c8;
      --horn: #d8cbb0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: radial-gradient(ellipse at 50% 30%, #14141f 0%, var(--ink) 62%);
      color: var(--bone);
      font-family: var(--serif-body);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
    .vignette {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(4, 4, 8, 0.75) 100%);
    }

    .stage {
      position: relative; z-index: 2;
      min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: clamp(8px, 2vh, 22px);
      padding: clamp(16px, 4vh, 48px) 20px;
      text-align: center;
    }

    .kicker {
      font-family: var(--serif-display);
      font-size: clamp(0.6rem, 1.6vw, 0.75rem);
      letter-spacing: 0.42em; text-transform: uppercase;
      color: var(--gold); opacity: 0.85;
      text-shadow: 0 1px 14px rgba(0, 0, 0, 0.9);
    }

    h1 {
      font-family: var(--serif-display); font-weight: 700;
      font-size: clamp(1.7rem, 6vw, 3.2rem); letter-spacing: 0.1em;
      color: var(--bone);
      text-shadow: 0 2px 30px rgba(0, 0, 0, 0.85), 0 0 44px rgba(198, 166, 107, 0.4);
    }

    .scene { width: min(92vw, 560px); filter: drop-shadow(0 18px 40px rgba(0, 0, 0, 0.55)); }
    .scene svg { display: block; width: 100%; height: auto; }

    /* ---- customization fills ---- */
    .fB  { fill: var(--body); }
    .fD  { fill: var(--dark); }
    .fBe { fill: var(--belly); }
    .fH  { fill: var(--horn); }
    .sB  { stroke: var(--body); }
    .sD  { stroke: var(--dark); }
    .sBe { stroke: var(--belly); }
    .sH  { stroke: var(--horn); }

    /* ---- controls ---- */
    .controls { display: flex; flex-direction: column; gap: 12px; align-items: center; }
    .crow { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: center; }
    .lbl {
      font-family: var(--serif-display); font-size: 0.62rem;
      letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--ash); width: 4.5em; text-align: right;
    }
    .seg { display: flex; gap: 8px; }
    .opt {
      font-family: var(--serif-display); font-size: 0.66rem; font-weight: 600;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--ash); background: rgba(9, 9, 14, 0.55);
      border: 1px solid rgba(198, 166, 107, 0.3);
      padding: 8px 18px; cursor: pointer; border-radius: 2px;
      transition: all 0.25s ease;
    }
    .opt:hover { color: var(--gold); border-color: var(--gold); }
    .opt.on {
      color: #e6cf9e; border-color: var(--gold);
      background: rgba(198, 166, 107, 0.16);
      box-shadow: 0 0 18px rgba(198, 166, 107, 0.2);
    }
    .cpick {
      -webkit-appearance: none; appearance: none;
      width: 36px; height: 36px; border: none; border-radius: 50%;
      background: none; cursor: pointer; padding: 0;
      transition: transform 0.2s ease;
    }
    .cpick:hover { transform: scale(1.12); }
    .cpick::-webkit-color-swatch-wrapper { padding: 0; }
    .cpick::-webkit-color-swatch {
      border: 2px solid rgba(198, 166, 107, 0.55); border-radius: 50%;
      box-shadow: 0 0 14px rgba(198, 166, 107, 0.25);
    }
    .cpick::-moz-color-swatch {
      border: 2px solid rgba(198, 166, 107, 0.55); border-radius: 50%;
    }

    .navrow { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
    .back {
      display: inline-block; font-family: var(--serif-display);
      font-size: 0.7rem; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase;
      color: rgba(166, 168, 176, 0.85); text-decoration: none;
      background: rgba(9, 9, 14, 0.55);
      border: 1px solid rgba(198, 166, 107, 0.3);
      padding: 13px 26px;
      transition: background 0.3s ease, box-shadow 0.3s ease, color 0.3s ease;
    }
    .back:hover, .back:focus-visible {
      color: var(--gold); border-color: var(--gold);
      box-shadow: 0 0 24px rgba(198, 166, 107, 0.25);
    }

    /* ---- scene animation ---- */
    .dragon { opacity: 0; transition: opacity 0.45s ease; }
    .dragon.on { opacity: 1; }
    .horns { transition: opacity 0.3s ease; }
    #scene[data-horns="off"] .horns { opacity: 0; }
    .bFire, .bWind { opacity: 0; transition: opacity 0.3s ease; }
    #scene[data-breath="fire"] .bFire { opacity: 1; }
    #scene[data-breath="wind"] .bWind { opacity: 1; }

    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes drift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-14px,4px); } }
    @keyframes sway { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(5deg); } }
    @keyframes grab { 0%,100% { transform: rotate(-14deg); } 50% { transform: rotate(12deg); } }
    @keyframes flapL { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-16deg); } }
    @keyframes flapR { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(16deg); } }
    @keyframes flick { from { transform: scale(1,1); } to { transform: scale(1.18,0.92); } }
    @keyframes ember { 0% { transform: translate(0,0); opacity: 1; } 100% { transform: translate(18px,-8px); opacity: 0; } }
    @keyframes windflow { to { stroke-dashoffset: -22; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes sparkle {
      0%,100% { opacity: 0.15; transform: scale(0.7); }
      50% { opacity: 0.9; transform: scale(1.1); }
    }

    #dragonCN.on { animation: bob 5s ease-in-out infinite; }
    #dragonNO.on { animation: bob 4.5s ease-in-out infinite; }
    .limb { transform-box: fill-box; transform-origin: 50% 0%; animation: grab 1.7s ease-in-out infinite; }
    .limb.alt { animation-delay: 0.85s; }
    .whisker { transform-box: fill-box; transform-origin: 0% 50%; animation: sway 3s ease-in-out infinite; }
    .mane { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 2.4s ease-in-out infinite; }
    .cloud { animation: drift 7s ease-in-out infinite; }
    .cloud.c2 { animation-delay: -2.4s; animation-duration: 9s; }
    .cloud.c3 { animation-delay: -4s; animation-duration: 8s; }
    .wingL { transform-box: fill-box; transform-origin: 100% 90%; animation: flapL 1.5s ease-in-out infinite; }
    .wingR { transform-box: fill-box; transform-origin: 0% 90%; animation: flapR 1.5s ease-in-out infinite; }
    .tailNo { transform-box: fill-box; transform-origin: 0% 50%; animation: sway 3.4s ease-in-out infinite; }
    .fl { transform-box: fill-box; transform-origin: 0% 50%; animation: flick 0.35s ease-in-out infinite alternate; }
    .fl.f2 { animation-delay: 0.15s; }
    .em { animation: ember 0.9s ease-out infinite; }
    .em.e2 { animation-delay: 0.3s; }
    .em.e3 { animation-delay: 0.6s; }
    .wl { animation: windflow 0.9s linear infinite; }
    .wl.w2 { animation-delay: 0.3s; }
    .wl.w3 { animation-delay: 0.6s; }
    .swirl { transform-box: fill-box; transform-origin: 50% 50%; animation: spin 1.6s linear infinite; }
    .spark { transform-origin: center; transform-box: fill-box; animation: sparkle 3.4s ease-in-out infinite; }
    .spark:nth-of-type(2) { animation-delay: 1.1s; }
    .spark:nth-of-type(3) { animation-delay: 2.2s; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <main class="stage">
    <p class="kicker">Shape the legend</p>
    <h1>Lamar's Dragon</h1>

    <div class="scene">
      <svg id="scene" viewBox="0 0 420 380" data-breath="fire" data-horns="on" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A customizable dragon flying in front of a full moon.">
        <defs>
          <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#f0e1be" stop-opacity="0.34" />

            <stop offset="1" stop-color="#f0e1be" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="moonFace" cx="0.42" cy="0.4" r="0.75">
            <stop offset="0" stop-color="#fbf3dd" />
            <stop offset="0.7" stop-color="#efe2c4" />
            <stop offset="1" stop-color="#d9c9a3" />
          </radialGradient>
        </defs>

        <!-- moon halo + full moon -->
        <circle cx="210" cy="155" r="160" fill="url(#halo)" />
        <circle cx="210" cy="152" r="105" fill="url(#moonFace)" />
        <circle cx="210" cy="152" r="105" fill="none" stroke="rgba(120,100,70,0.28)" stroke-width="2" />
        <g fill="#e2d4b3" opacity="0.55">
          <ellipse cx="172" cy="122" rx="16" ry="12" />
          <ellipse cx="240" cy="184" rx="11" ry="9" />
          <ellipse cx="196" cy="200" rx="8" ry="6" />
          <circle cx="252" cy="120" r="6" />
          <circle cx="158" cy="172" r="5" />
        </g>

        <!-- drifting clouds -->
        <g class="cloud" fill="#f2efe8" opacity="0.72" transform="translate(96,104)">
          <ellipse rx="17" ry="10" /><ellipse cx="13" cy="-6" rx="12" ry="9" /><ellipse cx="-13" cy="-5" rx="11" ry="8" />
        </g>
        <g class="cloud c2" fill="#f2efe8" opacity="0.6" transform="translate(350,92)">
          <ellipse rx="15" ry="9" /><ellipse cx="11" cy="-5" rx="10" ry="8" /><ellipse cx="-11" cy="-4" rx="9" ry="7" />
        </g>
        <g class="cloud c3" fill="#f2efe8" opacity="0.55" transform="translate(60,230)">
          <ellipse rx="14" ry="8" /><ellipse cx="10" cy="-5" rx="9" ry="7" />
        </g>

        <!-- ==================== CHINESE DRAGON ==================== -->
        <g id="dragonCN" class="dragon on">
          <!-- serpentine body + belly -->
          <path d="M288 178 C262 148 228 144 202 156 C180 166 170 176 152 174 C136 172 126 162 130 148 C134 136 124 126 110 130"
                fill="none" class="sB" stroke-width="27" stroke-linecap="round" />
          <path d="M286 186 C260 157 227 152 202 164 C182 174 173 182 156 181 C141 179 134 170 137 156 C140 145 132 137 118 139"
                fill="none" class="sBe" stroke-width="9" stroke-linecap="round" />
          <!-- dorsal spikes -->
          <g class="fD">
            <path d="M260 152 l4 -9 l4 9 Z" /><path d="M234 146 l4 -9 l4 9 Z" />
            <path d="M208 150 l4 -9 l4 9 Z" /><path d="M184 160 l4 -9 l4 9 Z" />
            <path d="M162 168 l4 -9 l4 9 Z" /><path d="M140 152 l4 -9 l4 9 Z" />
            <path d="M128 138 l4 -9 l4 9 Z" />
          </g>
          <!-- tail tuft -->
          <g class="mane" fill="none" stroke-linecap="round">
            <path d="M110 130 q-14 -6 -21 -15" stroke="#c6a66b" stroke-width="4" />
            <path d="M110 134 q-15 3 -24 0" stroke="#c6a66b" stroke-width="4" />
            <path d="M110 132 q-16 -3 -25 -7" class="sBe" stroke-width="4" />
          </g>
          <!-- four limbs grabbing at clouds -->
          <g class="limb">
            <path d="M240 170 q-6 15 2 26" fill="none" class="sB" stroke-width="7" stroke-linecap="round" />
            <circle cx="243" cy="198" r="6" class="fB" />
            <path d="M238 202 l-4 5 M243 204 l0 6 M248 202 l4 5" stroke="#d8cbb0" stroke-width="2.4" stroke-linecap="round" />
          </g>
          <g class="limb alt">
            <path d="M224 162 q-8 13 -2 25" fill="none" class="sD" stroke-width="6" stroke-linecap="round" />
            <circle cx="223" cy="189" r="5" class="fD" />
            <path d="M219 192 l-4 5 M223 194 l0 6 M227 192 l4 5" stroke="#d8cbb0" stroke-width="2" stroke-linecap="round" />
          </g>
          <g class="limb">
            <path d="M152 178 q-6 15 2 26" fill="none" class="sB" stroke-width="7" stroke-linecap="round" />
            <circle cx="155" cy="206" r="6" class="fB" />
            <path d="M150 210 l-4 5 M155 212 l0 6 M160 210 l4 5" stroke="#d8cbb0" stroke-width="2.4" stroke-linecap="round" />

          </g>
          <!-- clouds she's grabbing -->
          <g fill="#f2efe8" opacity="0.8">
            <g class="cloud" transform="translate(240,216)">
              <ellipse rx="15" ry="9" /><ellipse cx="11" cy="-5" rx="10" ry="8" /><ellipse cx="-11" cy="-4" rx="9" ry="7" />
            </g>
            <g class="cloud c2" transform="translate(150,224)">
              <ellipse rx="14" ry="8" /><ellipse cx="10" cy="-5" rx="9" ry="7" /><ellipse cx="-10" cy="-4" rx="8" ry="6" />
            </g>
          </g>
          <!-- head -->
          <g>
            <!-- mane -->
            <path class="mane fBe" d="M284 156 q-9 -12 -19 -9 q8 8 9 14 Z" />
            <path class="mane fBe" d="M274 170 q-12 -8 -21 -2 q9 5 11 11 Z" />
            <ellipse cx="304" cy="168" rx="25" ry="20" class="fB" />
            <ellipse cx="298" cy="160" rx="14" ry="9" fill="#ffffff" opacity="0.1" />
            <!-- muzzle -->

            <ellipse cx="323" cy="181" rx="11" ry="6" class="fBe" />
            <circle cx="330" cy="173" r="1.7" class="fD" />
            <circle cx="331" cy="180" r="1.7" class="fD" />
            <!-- eyes -->
            <g>
              <circle cx="296" cy="164" r="6" fill="#fdf8ff" />
              <circle cx="314" cy="164" r="6" fill="#fdf8ff" />
              <circle cx="296" cy="165" r="3.2" fill="#101a26" />

            </g>
            <path d="M289 155 q7 -5 13 -3 M308 152 q7 -2 13 3" stroke="#c6a66b" stroke-width="2.6" fill="none" stroke-linecap="round" />
            <!-- deer antlers -->
            <g class="horns sH" stroke-width="3.4" fill="none" stroke-linecap="round">
              <path d="M294 153 C290 134 296 122 288 108" />
              <path d="M291 139 C283 133 279 125 279 115" />
              <path d="M293 126 C299 118 301 110 299 102" />
              <path d="M314 153 C318 134 312 122 320 108" />
              <path d="M317 139 C325 133 329 125 329 115" />
              <path d="M315 126 C309 118 307 110 309 102" />
            </g>
            <!-- whiskers -->
            <g class="whisker" stroke="#c6a66b" stroke-width="2.4" fill="none" stroke-linecap="round">
              <path d="M333 171 C350 162 363 164 373 172" />
              <path d="M333 184 C348 191 361 189 370 181" />
            </g>
            <!-- breath -->
            <g transform="translate(338,176)">
              <g class="bFire">
                <path class="fl" d="M0 -4 C12 -13 26 -10 32 -2 C26 7 12 9 0 4 Z" fill="#ff9a3d" />
                <path class="fl f2" d="M8 -2 C16 -8 24 -6 28 0 C23 5 15 5 8 2 Z" fill="#ffd66e" />
                <circle class="em" cx="36" cy="0" r="2.4" fill="#ffb14d" />
                <circle class="em e2" cx="42" cy="-4" r="1.9" fill="#ff9a3d" />
                <circle class="em e3" cx="48" cy="3" r="1.5" fill="#ffd66e" />
              </g>
              <g class="bWind" stroke="#9fd8ff" fill="none" stroke-linecap="round" stroke-width="3" stroke-dasharray="10 12">
                <path class="wl" d="M2 -9 C20 -17 40 -15 56 -7" />
                <path class="wl w2" d="M2 0 C24 -4 44 -2 60 -11" />
                <path class="wl w3" d="M2 9 C18 13 38 11 50 3" />
                <circle class="swirl" cx="58" cy="-14" r="6" stroke-dasharray="4 5" />

            </g>
          </g>
        </g>

        <!-- ==================== NORDIC DRAGON ==================== -->
        <g id="dragonNO" class="dragon">
          <!-- wings -->
          <g class="wingL">
            <path d="M186 218 C160 210 118 192 100 112 C118 160 146 158 152 164 C142 174 146 192 162 202 C146 202 138 212 146 220 Z" class="fB" />

          <!-- feet -->

            <ellipse cx="215" cy="208" rx="13" ry="5" class="fBe" />
            <circle cx="206" cy="199" r="1.8" class="fD" />
            <circle cx="224" cy="199" r="1.8" class="fD" />
            <!-- breath -->
            <g transform="translate(234,200)">
              <g class="bFire">
                <path class="fl" d="M0 -4 C12 -13 26 -10 32 -2 C26 7 12 9 0 4 Z" fill="#ff9a3d" />
                <path class="fl f2" d="M8 -2 C16 -8 24 -6 28 0 C23 5 15 5 8 2 Z" fill="#ffd66e" />
                <circle class="em" cx="36" cy="0" r="2.4" fill="#ffb14d" />

                <path class="wl" d="M2 -9 C20 -17 40 -15 56 -7" />
                <path class="wl w2" d="M2 0 C24 -4 44 -2 60 -11" />
                <path class="wl w3" d="M2 9 C18 13 38 11 50 3" />
                <circle class="swirl" cx="58" cy="-14" r="6" stroke-dasharray="4 5" />

            </g>
          </g>
        </g>

        <!-- gold sparkles -->

  <script>
    // Twinkling starfield
    (function () {
      const canvas = document.getElementById('stars');
      const ctx = canvas.getContext('2d');
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let stars = [], w = 0, h = 0, dpr = 1;
      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth; h = window.innerHeight;
        canvas.width = w * dpr; canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const count = Math.min(180, Math.round((w * h) / 9000));
        stars = Array.from({ length: count }, () => ({
          x: Math.random() * w, y: Math.random() * h,
          r: 0.4 + Math.random() * 1.1,
          p: Math.random() * Math.PI * 2,
          s: 0.4 + Math.random() * 0.8,
          warm: Math.random() < 0.3,
        }));
      }
      function draw(t) {
        ctx.clearRect(0, 0, w, h);
        for (const st of stars) {
          const tw = reduced ? 0.8 : 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(st.p + t * 0.001 * st.s));
          ctx.globalAlpha = tw;
          ctx.fillStyle = st.warm ? '#e8d3a8' : '#dfe2ea';
          ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
      window.addEventListener('resize', () => { resize(); draw(0); });
      resize();
      if (reduced) draw(0); else (function loop(t) { draw(t); requestAnimationFrame(loop); })(0);
    })();

    // ---------------- Dragon workshop ----------------
    (function () {
      const svg = document.getElementById('scene');
      const cn = document.getElementById('dragonCN');
      const no = document.getElementById('dragonNO');

      // darken an arbitrary #rrggbb by factor f (for limb/spike shading)
      const shade = (hex, f) => {
        const n = parseInt(hex.slice(1), 16);
        const r = Math.round(((n >> 16) & 255) * f);
        const g = Math.round(((n >> 8) & 255) * f);
        const b = Math.round((n & 255) * f);
        return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
      };

      // option toggles (kind / horns / breath)
      function bindSeg(attr, apply) {
        document.querySelectorAll(`[data-${attr}]`).forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll(`[data-${attr}]`).forEach(b => b.classList.remove('on'));
            btn.classList.add('on');
            apply(btn.dataset[attr]);
          });
        });
      }
      bindSeg('type', t => {
        cn.classList.toggle('on', t === 'cn');
        no.classList.toggle('on', t === 'no');
      });
      bindSeg('horns', v => svg.dataset.horns = v);
      bindSeg('breath', v => svg.dataset.breath = v);

      // full color wheels — body (auto-derives the dark shade), belly, horns
      document.getElementById('pickBody').addEventListener('input', e => {
        svg.style.setProperty('--body', e.target.value);
        svg.style.setProperty('--dark', shade(e.target.value, 0.72));
      });
      document.getElementById('pickBelly').addEventListener('input', e => {
        svg.style.setProperty('--belly', e.target.value);
      });
      document.getElementById('pickHorn').addEventListener('input', e => {
        svg.style.setProperty('--horn', e.target.value);
      });
    })();
  </script>

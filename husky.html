<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#09090D" />
  <title>Zoe</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 27 16 16 29 5 16Z' fill='%23481B2B' stroke='%23C6A66B' stroke-width='2'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --ink: #09090d;
      --coal: #15151d;
      --wine: #481b2b;
      --gold: #c6a66b;
      --ash: #a6a8b0;
      --bone: #eae7e1;
      --serif-display: "Cinzel", Georgia, "Times New Roman", serif;
      --serif-body: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: radial-gradient(ellipse at 50% 30%, #14141f 0%, var(--ink) 62%);
      color: var(--bone);
      font-family: var(--serif-body);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #stars {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(4, 4, 8, 0.75) 100%);
    }

    .stage {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 2.5vh, 26px);
      padding: clamp(20px, 5vh, 56px) 20px;
      text-align: center;
    }

    .kicker {
      font-family: var(--serif-display);
      font-size: clamp(0.62rem, 1.6vw, 0.78rem);
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0.85;
      text-shadow: 0 1px 14px rgba(0, 0, 0, 0.9);
    }

    h1 {
      font-family: var(--serif-display);
      font-weight: 700;
      font-size: clamp(1.9rem, 6.5vw, 3.6rem);
      letter-spacing: 0.1em;
      color: var(--bone);
      text-shadow: 0 2px 30px rgba(0, 0, 0, 0.85), 0 0 44px rgba(198, 166, 107, 0.4);
    }

    .scene {
      width: min(92vw, 560px);
      filter: drop-shadow(0 18px 40px rgba(0, 0, 0, 0.55));
    }
    .scene svg { display: block; width: 100%; height: auto; }

    .sub {
      font-style: italic;
      font-size: clamp(1rem, 2.4vw, 1.2rem);
      color: #dcd8cf;
      text-shadow: 0 1px 18px rgba(0, 0, 0, 0.9);
      max-width: 42ch;
    }

    .actions, .navrow {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 4px;
    }
    .back {
      display: inline-block;
      font-family: var(--serif-display);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--gold);
      text-decoration: none;
      background: rgba(9, 9, 14, 0.55);
      border: 1px solid rgba(198, 166, 107, 0.6);
      padding: 16px 38px;
      cursor: pointer;
      transition: background 0.3s ease, box-shadow 0.3s ease, color 0.3s ease, opacity 0.3s ease;
    }
    .back:hover,
    .back:focus-visible {
      background: rgba(198, 166, 107, 0.18);
      box-shadow: 0 0 30px rgba(198, 166, 107, 0.28);
      color: #e6cf9e;
    }
    .back:disabled {
      opacity: 0.35;
      cursor: default;
      background: rgba(9, 9, 14, 0.55);
      box-shadow: none;
      color: var(--gold);
    }
    .back.subtle {
      color: rgba(166, 168, 176, 0.85);
      border-color: rgba(198, 166, 107, 0.3);
      font-size: 0.7rem;
      padding: 14px 28px;
    }
    .back.subtle:hover { color: var(--gold); border-color: var(--gold); }

    /* ---- scene animation ---- */
    .pose { opacity: 0; transition: opacity 0.35s ease; }
    .pose.on { opacity: 1; }
    .pose.eating { animation: eatBob 0.45s ease-in-out infinite; }
    @keyframes eatBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(6px); }
    }
    @keyframes wag {
      0%, 100% { transform: rotate(-9deg); }
      50% { transform: rotate(11deg); }
    }
    .tail { transform-origin: 154px 252px; }
    .wagging .tail { animation: wag 0.28s ease-in-out infinite; }

    .eyes-happy, .eyes-sleep { opacity: 0; transition: opacity 0.15s ease; }
    .eyes-open { transition: opacity 0.15s ease; }
    #huskyFace.happy .eyes-open, #huskyFace.sleep .eyes-open { opacity: 0; }
    #huskyFace.happy .eyes-happy, #huskyFace.sleep .eyes-sleep { opacity: 1; }
    .mouth-sleep { opacity: 0; transition: opacity 0.15s ease; }
    #huskyFace.sleep .mouth-open { opacity: 0; }
    #huskyFace.sleep .mouth-sleep { opacity: 1; }

    #bowl, #woofBubble { opacity: 0; transition: opacity 0.4s ease; }
    #bowl.show, #woofBubble.show { opacity: 1; }
    .kibble { transition: opacity 0.6s ease; }
    #bowl.empty .kibble { opacity: 0; }

    #zzz { opacity: 0; }
    #zzz.show { opacity: 1; }
    #zzz.show text { animation: zfloat 2.2s ease-in-out infinite; }
    #zzz.show text:nth-child(2) { animation-delay: 0.5s; }
    #zzz.show text:nth-child(3) { animation-delay: 1s; }
    @keyframes zfloat {
      0%, 100% { transform: translateY(0); opacity: 0.55; }
      50% { transform: translateY(-9px); opacity: 1; }
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    @keyframes hop {
      0%, 100% { transform: translateY(0); }
      30% { transform: translateY(-14px); }
      60% { transform: translateY(0); }
      80% { transform: translateY(-7px); }
    }
    #dogStand { animation: bob 4.5s ease-in-out infinite; }
    #dogStand.hopping { animation: hop 0.8s ease-in-out 2; }

    @keyframes sparkle {
      0%, 100% { opacity: 0.15; transform: scale(0.7); }
      50% { opacity: 0.9; transform: scale(1.1); }
    }
    .spark { transform-origin: center; transform-box: fill-box; animation: sparkle 3.4s ease-in-out infinite; }
    .spark:nth-of-type(2) { animation-delay: 1.1s; }
    .spark:nth-of-type(3) { animation-delay: 2.2s; }

    @media (prefers-reduced-motion: reduce) {
      #dogStand, .spark, #zzz.show text { animation: none; }
      .wagging .tail { animation: none; }
      .pose.eating { animation: none; }
    }
  </style>
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <main class="stage">
    <p class="kicker">The goodest girl</p>
    <h1>Zoe</h1>

    <div class="scene" role="img" aria-label="A black and white husky with blue eyes under a full moon.">
      <svg viewBox="0 0 420 380" xmlns="http://www.w3.org/2000/svg">

            <ellipse cx="31" cy="13" rx="6.5" ry="4" fill="#e887ad" opacity="0.4" />

          <ellipse cx="274" cy="290" rx="24" ry="26" fill="url(#furDark)" />
          <ellipse cx="215" cy="248" rx="50" ry="58" fill="url(#furDark)" />
          <ellipse cx="215" cy="260" rx="30" ry="38" fill="#f2efe8" />

          </g>
          <text x="322" y="323" text-anchor="middle" font-family="Cinzel, serif" font-size="9" font-weight="700" letter-spacing="2" fill="#f2efe8">ZOE</text>

        <!-- Woof! bubble -->
        <g id="woofBubble">
          <path d="M262 148 L252 158 L266 152 Z" fill="#fdf6ee" />
          <rect x="264" y="122" width="86" height="34" rx="14" fill="#fdf6ee" />

        <g id="zzz" fill="#c6a66b" font-family="Cinzel, serif" font-weight="700">

        <!-- gold sparkles -->

    </div>

    <p class="sub">Black-and-white, blue-eyed, and permanently hungry.</p>

    <div class="actions">
      <button class="back" id="petBtn" type="button">Pet the dog</button>
      <button class="back" id="sitBtn" type="button">Sit</button>
      <button class="back" id="dinnerBtn" type="button">Dinner is ready</button>
    </div>

    <div class="navrow">
      <a class="back subtle" href="penguin.html">← Batriqi</a>
      <a class="back subtle" href="index.html">Back to the beginning</a>
    </div>
  </main>

  <script>
    // Twinkling starfield — same vibes as the main sky, featherweight edition.
    (function () {
      const canvas = document.getElementById('stars');
      const ctx = canvas.getContext('2d');
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let stars = [];
      let w = 0, h = 0, dpr = 1;

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const count = Math.min(180, Math.round((w * h) / 9000));
        stars = Array.from({ length: count }, () => ({
          x: Math.random() * w,
          y: Math.random() * h,
          r: 0.4 + Math.random() * 1.1,
          p: Math.random() * Math.PI * 2,
          s: 0.4 + Math.random() * 0.8,
          warm: Math.random() < 0.3,
        }));
      }

      function draw(t) {
        ctx.clearRect(0, 0, w, h);
        for (const st of stars) {
          const tw = reduced ? 0.8 : 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(st.p + t * 0.001 * st.s));
          ctx.globalAlpha = tw;
          ctx.fillStyle = st.warm ? '#e8d3a8' : '#dfe2ea';
          ctx.beginPath();
          ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      window.addEventListener('resize', () => { resize(); draw(0); });
      resize();
      if (reduced) {
        draw(0);
      } else {
        (function loop(t) { draw(t); requestAnimationFrame(loop); })(0);
      }
    })();

    // ---------------- Zoe's little brain ----------------
    (function () {
      const face = document.getElementById('huskyFace');
      const stand = document.getElementById('dogStand');
      const sit = document.getElementById('dogSit');
      const lie = document.getElementById('dogLie');
      const bowl = document.getElementById('bowl');
      const woof = document.getElementById('woofBubble');
      const zzz = document.getElementById('zzz');
      const petBtn = document.getElementById('petBtn');
      const sitBtn = document.getElementById('sitBtn');
      const dinnerBtn = document.getElementById('dinnerBtn');

      let mode = 'stand';        // stand | sit | eat | sleep
      let sitTimer = null;
      let petTimer = null;

      const poses = [stand, sit, lie];
      function show(p) {
        poses.forEach(el => el.classList.toggle('on', el === p));
      }
      function setButtons(disabled) {
        petBtn.disabled = disabled;
        sitBtn.disabled = disabled;
        dinnerBtn.disabled = disabled;
      }

      // tiny synthesized "wuff-wuff" — created inside the click, allowed by browsers
      function bark() {
        try {
          const A = bark.ctx || (bark.ctx = new (window.AudioContext || window.webkitAudioContext)());
          if (A.state === 'suspended') A.resume();
          const t = A.currentTime;
          [0, 0.3].forEach(d => {
            const o = A.createOscillator();
            const g = A.createGain();
            const f = A.createBiquadFilter();
            o.type = 'sawtooth';
            o.frequency.setValueAtTime(340, t + d);
            o.frequency.exponentialRampToValueAtTime(130, t + d + 0.14);
            f.type = 'lowpass';
            f.frequency.value = 900;
            g.gain.setValueAtTime(0.0001, t + d);
            g.gain.exponentialRampToValueAtTime(0.18, t + d + 0.02);
            g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.18);
            o.connect(f); f.connect(g); g.connect(A.destination);
            o.start(t + d); o.stop(t + d + 0.22);
          });
        } catch (e) {}
      }

      petBtn.addEventListener('click', () => {
        if (mode !== 'stand' && mode !== 'sit') return;
        clearTimeout(petTimer);
        // happy dog: tail helicopter + happy eyes + hop + woof
        stand.classList.add('wagging');
        stand.classList.remove('hopping');
        void stand.getBBox(); // force reflow to restart the hop animation
        stand.classList.add('hopping');
        face.classList.add('happy');
        woof.classList.add('show');
        bark();
        petTimer = setTimeout(() => {
          stand.classList.remove('wagging', 'hopping');
          face.classList.remove('happy');
          woof.classList.remove('show');
        }, 2600);
      });

      sitBtn.addEventListener('click', () => {
        if (mode !== 'stand' && mode !== 'sit') return;
        clearTimeout(sitTimer);
        mode = 'sit';
        show(sit);
        sitTimer = setTimeout(() => {
          mode = 'stand';
          show(stand);
        }, 10000); // sits for exactly 10 seconds
      });

      dinnerBtn.addEventListener('click', () => {
        if (mode !== 'stand' && mode !== 'sit') return;
        clearTimeout(sitTimer);
        mode = 'eat';
        setButtons(true);
        show(stand);
        bowl.classList.remove('empty');
        bowl.classList.add('show');
        stand.classList.add('eating');
        face.classList.remove('sleep');

        // finish the food, then nap
        setTimeout(() => bowl.classList.add('empty'), 3400);
        setTimeout(() => {
          stand.classList.remove('eating');
          show(lie);
          face.classList.add('sleep');
          zzz.classList.add('show');
          mode = 'sleep';
        }, 4200);
        setTimeout(() => {
          zzz.classList.remove('show');
          face.classList.remove('sleep');
          bowl.classList.remove('show');
          show(stand);
          mode = 'stand';
          setButtons(false);
        }, 4200 + 10000); // sleeps for 10 seconds
      });
    })();
  </script>
</body>
</html>
